<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="WAVE, les concerts à découvrir près de chez vous.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAVE - Les concerts près de chez vous</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a class="logo" href="#top" aria-label="WAVE - Accueil">
        <h1 class="visually-hidden">WAVE - les concerts près de chez vous</h1>
        <img src="assets/wave-logo.svg" alt="WAVE" width="126" height="34">
      </a>
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="#concerts">Concerts</a><a href="#artistes">Artistes</a><a href="#villes">Villes</a>
      </nav>
      <a class="account-link" href="#newsletter">Créer un compte</a>
    </div>
  </header>
  <!-- Main -->
  <main id="top">
    <!-- Hero section -->
    <section class="hero container" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="kicker"><span></span>Lille · Cette semaine</p>
        <h2 id="page-title">Le prochain son qui va te faire vibrer.</h2>
        <p class="hero-text">Des petites salles aux grandes scènes, découvre les artistes qui jouent près de chez toi.</p>
        <a class="primary-button" href="#concerts">Voir les concerts <span aria-hidden="true">↘</span></a>
      </div>
      <figure class="hero-visual">
        <img src="assets/concert-hero.png" alt="Un concert dans une petite salle éclairée en bleu et violet">
        <figcaption><span>À ne pas manquer</span><strong>Pulse Night · 21 septembre</strong></figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
